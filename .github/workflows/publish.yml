# Keeps the published images patched, in chained jobs:
#
#   check    (daily at 14:07 UTC)
#     Compares the published images, as recorded on the `state` branch, with
#     what a rebuild would produce, without pulling them:
#     - Hermes: pending Debian updates, found by running apt against the
#       published image's package database in a small Debian container.
#     - signal-cli: a newer build of the distroless base.
#     A missing record means a rebuild.
#   build    (when the check finds an update, on a push to main, on a pull
#            request, or on demand)
#     Rebuilds both images from scratch, tests them, produces an SBOM and a
#     vulnerability report for each, and fingerprints what went into them.
#   publish  (main only, for each image whose fingerprint differs from the
#            published one)
#     Pushes to GHCR, signs keylessly with cosign, attaches the SBOM as a
#     cosign attestation and adds a GitHub build provenance attestation.
#   record   (after a publish)
#     Records the published images on the `state` branch.
#
# Pull requests stop after the build: nothing is pushed, signed or recorded.
# The only credential is the workflow's own GITHUB_TOKEN. The steps call the
# documented scripts in scripts/, which also run locally; upstream-report.yml
# reports what a rebuild cannot fix.

name: publish

on:
  pull_request:
    paths:
      - "images/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "7 14 * * *"
  workflow_dispatch:

permissions: {}

# Runs for main share one queue, so the state branch has one writer at a time.
# A pull request cancels its own superseded runs.
concurrency:
  group: publish-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HERMES_REPO: ghcr.io/blissful-living/hermes-agent-patched
  SIGNAL_REPO: ghcr.io/blissful-living/signal-cli-distroless
  SIGNAL_BASE: gcr.io/distroless/cc-debian13:nonroot

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the record of the published images
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: state
          persist-credentials: false

      - name: Pending Debian updates for Hermes
        id: hermes
        run: |
          set -euo pipefail
          if [ ! -f state/hermes-agent-patched/dpkg-status.gz ]; then
            echo "pending=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gunzip -c state/hermes-agent-patched/dpkg-status.gz > status
          scripts/pending-debian-updates.sh status > upgradable.txt
          echo "pending=$(wc -l < upgradable.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          {
            echo "## Hermes: pending Debian updates"
            echo '```'
            cat upgradable.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Newer distroless base for signal-cli
        id: signal
        run: |
          set -euo pipefail
          current=$(scripts/image-digest.sh "$SIGNAL_BASE")
          recorded=$(cat state/signal-cli-distroless/base-digest 2>/dev/null || true)
          if [ "$current" != "$recorded" ]; then changed=true; else changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "## signal-cli: distroless base" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: \`${recorded:-unknown}\`; current: \`$current\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide
        id: decide
        env:
          HERMES_PENDING: ${{ steps.hermes.outputs.pending }}
          SIGNAL_CHANGED: ${{ steps.signal.outputs.changed }}
        run: |
          if [ "$HERMES_PENDING" != "0" ] || [ "$SIGNAL_CHANGED" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "**Rebuilding:** Hermes updates pending: $HERMES_PENDING; new distroless base: $SIGNAL_CHANGED." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "**No rebuild needed.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      hermes_publish: ${{ steps.fingerprint.outputs.hermes_publish }}
      hermes_version: ${{ steps.hermes.outputs.version }}
      signal_publish: ${{ steps.fingerprint.outputs.signal_publish }}
      signal_version: ${{ steps.signal.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the record of the published images
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: state
          persist-credentials: false

      - name: Build Hermes
        id: hermes
        run: |
          set -euo pipefail
          scripts/build-image.sh hermes-agent-patched
          echo "version=$(scripts/upstream-version.sh hermes-agent-patched)" >> "$GITHUB_OUTPUT"

      - name: Test Hermes
        run: scripts/test-hermes.sh local/hermes-agent-patched

      - name: Record Hermes's package database and Chromium version
        run: scripts/hermes-facts.sh local/hermes-agent-patched new-state/hermes-agent-patched

      - name: Build signal-cli
        id: signal
        run: |
          set -euo pipefail
          scripts/build-image.sh signal-cli-distroless
          mkdir -p new-state/signal-cli-distroless
          docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' local/signal-cli-distroless \
            > new-state/signal-cli-distroless/base-digest
          echo "version=$(scripts/upstream-version.sh signal-cli-distroless)" >> "$GITHUB_OUTPUT"

      - name: Test signal-cli
        env:
          VERSION: ${{ steps.signal.outputs.version }}
        run: scripts/test-signal-cli.sh local/signal-cli-distroless "$VERSION"

      # A fingerprint that matches the published image's means the rebuild
      # changed nothing, so the image is not published again.
      - name: Fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          {
            echo "## Fingerprints"
            echo "| Image | Fingerprint | Published fingerprint | Publish |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in hermes-agent-patched:hermes signal-cli-distroless:signal; do
            name=${pair%:*}
            key=${pair#*:}
            fingerprint=$(scripts/fingerprint.sh "$name" "new-state/$name")
            echo "$fingerprint" > "new-state/$name/fingerprint"
            published=$(cat "state/$name/fingerprint" 2>/dev/null || true)
            if [ "$fingerprint" != "$published" ]; then publish=true; else publish=false; fi
            echo "${key}_publish=$publish" >> "$GITHUB_OUTPUT"
            echo "| $name | \`${fingerprint:0:16}\` | \`${published:0:16}\` | $publish |" >> "$GITHUB_STEP_SUMMARY"
          done

      # The SBOMs list packages without the files each one installs: scanners
      # need only the packages, and the file listings would more than triple
      # the size of the SBOM attestation.
      - name: SBOM for Hermes
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_FILE_METADATA_SELECTION: none
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
        with:
          image: local/hermes-agent-patched
          format: spdx-json
          output-file: hermes-agent-patched.spdx.json
          upload-artifact: false

      - name: SBOM for signal-cli
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_FILE_METADATA_SELECTION: none
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
        with:
          image: local/signal-cli-distroless
          format: spdx-json
          output-file: signal-cli-distroless.spdx.json
          upload-artifact: false

      - name: Record the SBOMs
        run: |
          set -euo pipefail
          for name in hermes-agent-patched signal-cli-distroless; do
            gzip -9n < "$name.spdx.json" > "new-state/$name/sbom.spdx.json.gz"
          done

      # The report goes to the job summary and to the log.
      - name: Vulnerability report
        run: |
          set -euo pipefail
          stable=$(scripts/chrome-stable.sh || echo unknown)
          {
            echo "Hermes bundles Chromium \`$(cat new-state/hermes-agent-patched/chromium-version)\`; Chrome stable is \`$stable\`."
            echo
            scripts/report.sh hermes-agent-patched signal-cli-distroless
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-state
          path: new-state
          if-no-files-found: error
          retention-days: 7

      # The publish job pushes exactly the images built and tested here.
      - name: Save the images for publishing
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          (steps.fingerprint.outputs.hermes_publish == 'true' || steps.fingerprint.outputs.signal_publish == 'true')
        run: |
          set -euo pipefail
          mkdir -p image-archives
          for name in hermes-agent-patched signal-cli-distroless; do
            docker save "local/$name" | zstd -T0 -3 -q -o "image-archives/$name.tar.zst"
          done
          ls -lh image-archives

      - if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          (steps.fingerprint.outputs.hermes_publish == 'true' || steps.fingerprint.outputs.signal_publish == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-archives
          path: image-archives
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.build.outputs.hermes_publish == 'true' || needs.build.outputs.signal_publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      hermes_image: ${{ steps.hermes.outputs.image }}
      signal_image: ${{ steps.signal.outputs.image }}
    steps:
      # Only the scripts, from the commit that was built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: new-state
          path: new-state

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-archives
          path: image-archives

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Hermes
        id: hermes
        if: needs.build.outputs.hermes_publish == 'true'
        env:
          VERSION: ${{ needs.build.outputs.hermes_version }}
        run: |
          set -euo pipefail
          zstd -dc image-archives/hermes-agent-patched.tar.zst | docker load
          gunzip -c new-state/hermes-agent-patched/sbom.spdx.json.gz > hermes-agent-patched.spdx.json
          image=$(scripts/publish-image.sh local/hermes-agent-patched "$HERMES_REPO" "$VERSION" hermes-agent-patched.spdx.json)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${image#*@}" >> "$GITHUB_OUTPUT"
          echo "Published \`$image\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish signal-cli
        id: signal
        if: needs.build.outputs.signal_publish == 'true'
        env:
          VERSION: ${{ needs.build.outputs.signal_version }}
        run: |
          set -euo pipefail
          zstd -dc image-archives/signal-cli-distroless.tar.zst | docker load
          gunzip -c new-state/signal-cli-distroless/sbom.spdx.json.gz > signal-cli-distroless.spdx.json
          image=$(scripts/publish-image.sh local/signal-cli-distroless "$SIGNAL_REPO" "$VERSION" signal-cli-distroless.spdx.json)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${image#*@}" >> "$GITHUB_OUTPUT"
          echo "Published \`$image\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Provenance for Hermes
        if: needs.build.outputs.hermes_publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.HERMES_REPO }}
          subject-digest: ${{ steps.hermes.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Provenance for signal-cli
        if: needs.build.outputs.signal_publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.SIGNAL_REPO }}
          subject-digest: ${{ steps.signal.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # `latest` moves only once the image is signed and attested.
      - name: Tag latest
        env:
          HERMES_IMAGE: ${{ steps.hermes.outputs.image }}
          SIGNAL_IMAGE: ${{ steps.signal.outputs.image }}
        run: scripts/tag-latest.sh "$HERMES_IMAGE" "$SIGNAL_IMAGE"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  record:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the scripts, from the commit that was built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: new-state
          path: new-state

      - name: Record the published images
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_IMAGE: ${{ needs.publish.outputs.hermes_image }}
          SIGNAL_IMAGE: ${{ needs.publish.outputs.signal_image }}
        run: |
          scripts/record-state.sh new-state \
            "hermes-agent-patched=$HERMES_IMAGE" "signal-cli-distroless=$SIGNAL_IMAGE"
